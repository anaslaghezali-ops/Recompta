<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription — Recompta</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .auth-page { max-width: 420px; margin: 3rem auto; padding: 0 1rem; }
    .auth-card { padding: 2rem; }
    .auth-card h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
    .auth-card form { display: grid; gap: 1rem; margin-top: 1.5rem; }
    .auth-link { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: var(--muted); }
    .auth-link a { color: var(--primary); }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card">
      <p class="eyebrow">Recompta</p>
      <h1>Créer votre cabinet</h1>
      <p class="hint">Essai gratuit 14 jours — automatisez vos déclarations TVA</p>
      <form id="registerForm">
        <label>Nom du cabinet <input type="text" id="cabinetName" required placeholder="Ex: Cabinet Aichoum & Associés" /></label>
        <label>Votre nom <input type="text" id="displayName" placeholder="Ex: Mohamed Aichoum" /></label>
        <label>Email <input type="email" id="email" required autocomplete="email" /></label>
        <label>Mot de passe <input type="password" id="password" required minlength="8" autocomplete="new-password" /></label>
        <button type="submit" class="primary large">Créer mon compte</button>
      </form>
      <p id="error" class="status error" hidden></p>
      <p class="auth-link">Déjà inscrit ? <a href="/login.html">Se connecter</a></p>
    </div>
  </div>
  <script type="module">
    import { authHeaders, getSupabase } from "/auth.js";

    const sb = await getSupabase();
    if (!sb) {
      document.getElementById("error").hidden = false;
      document.getElementById("error").textContent = "Supabase non configuré sur ce serveur.";
    }

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("error");
      err.hidden = true;

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const cabinetName = document.getElementById("cabinetName").value.trim();
      const displayName = document.getElementById("displayName").value.trim();

      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) {
        err.hidden = false;
        err.textContent = error.message;
        return;
      }

      if (!data.session) {
        err.hidden = false;
        err.className = "status success";
        err.textContent = "Vérifiez votre email pour confirmer le compte, puis connectez-vous.";
        return;
      }

      const onboard = await fetch("/api/onboard", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(await authHeaders()) },
        body: JSON.stringify({ cabinet_name: cabinetName, display_name: displayName }),
      });

      if (!onboard.ok) {
        err.hidden = false;
        err.textContent = await onboard.text();
        return;
      }

      window.location.href = "/dashboard.html";
    });
  </script>
</body>
</html>
