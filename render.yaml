services:
  - type: web
    name: recompta
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_VISION_MODEL_FALLBACK
        value: gpt-5.6-terra
