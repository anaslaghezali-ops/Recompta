name: Tests

on:
  pull_request:
  push:
    # main2 est la branche servie : la CI doit aussi tourner sur ses envois.
    branches: [main, main2, main2-chatgpt, "cursor/**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dépendances
        run: pip install -r backend/requirements.txt

      - name: Tests Python
        working-directory: backend
        run: |
          set -e
          for t in scripts/test_*.py; do
            case "$t" in
              # Besoin de scans réels absents du dépôt.
              *test_scan_routing.py|*test_upload_folder.py) continue ;;
            esac
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

      - name: Syntaxe JavaScript (fichiers racine + scripts module des pages)
        # Aucun test ne charge app.js, workspace-review.js… : sans ce contrôle,
        # une erreur de syntaxe passait la CI (incident du 19/11).
        run: |
          set -e
          dir="$(mktemp -d)"
          for f in *.js test-*.mjs; do
            cp "$f" "$dir/${f%.*}.mjs"
            node --check "$dir/${f%.*}.mjs" || { echo "::error file=$f::erreur de syntaxe"; exit 1; }
          done
          python3 - "$dir" <<'PY'
          import re, glob, subprocess, sys
          bad = 0
          for f in sorted(glob.glob("*.html")):
              for i, body in enumerate(re.findall(r'<script type="module">(.*?)</script>', open(f).read(), re.S)):
                  path = f"{sys.argv[1]}/{f}.{i}.mjs"
                  open(path, "w").write(body)
                  if subprocess.run(["node", "--check", path]).returncode:
                      print(f"::error file={f}::erreur de syntaxe dans le script module {i}")
                      bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: Tests JS
        run: |
          set -e
          for t in test-*.mjs docs/test-*.mjs; do
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

      - name: Copies docs/ et backend/static/ identiques à la racine
        run: |
          status=0
          for f in docs/*.js docs/*.html docs/*.css backend/static/*.js backend/static/*.html backend/static/*.css; do
            [ -f "$f" ] || continue
            root="$(basename "$f")"
            [ -f "$root" ] || continue
            if ! cmp -s "$f" "$root"; then
              echo "::error file=$f::diffère de $root à la racine"
              status=1
            fi
          done
          exit $status

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17  # même version majeure que la production
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Migrations rejouées + tests SQL (RLS, numérotation, ventes)
        env:
          PGURL: postgresql://postgres:postgres@localhost:5432/postgres
        run: supabase/tests/run.sh
