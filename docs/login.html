<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recompta — Connexion</title>
  <link rel="stylesheet" href="styles.css?v=auth2" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <p class="eyebrow">Recompta</p>
      <h1>Connexion</h1>
      <p class="subtitle">Espace cabinets comptables. Le premier compte devient super-admin après validation SQL.</p>
    </div>
  </header>

  <main class="container login-wrap">
    <section class="card login-card">
      <h2 id="loginTitle">Se connecter</h2>
      <p class="hint" id="configHint" hidden>
        Un seul fichier : <code>docs/supabase-config.js</code>.
        Clé <strong>anon</strong> du projet dont l’URL est
        <code>pbyoxfxngfutoiqjirkx</code>
        (pas un autre projet). Dashboard → Settings → API Keys.
      </p>
      <form id="authForm">
        <label>Email
          <input id="email" type="email" autocomplete="username" required />
        </label>
        <label>Mot de passe
          <input id="password" type="password" autocomplete="current-password" minlength="6" required />
        </label>
        <p class="hint error" id="authError" hidden></p>
        <p class="hint success" id="authOk" hidden></p>
        <div class="actions">
          <button id="submitBtn" class="primary" type="submit">Connexion</button>
        </div>
      </form>
      <p class="hint">
        <button id="toggleMode" class="linkish" type="button">Créer le compte super-admin</button>
        · <a href="index.html">Retour à l'outil</a>
      </p>
    </section>
  </main>

  <script type="module">
    import {
      isSupabaseConfigured,
      getSession,
      signIn,
      signUp,
      authErrorMessage,
    } from "./auth-client.js?v=auth2";

    const form = document.getElementById("authForm");
    const title = document.getElementById("loginTitle");
    const submitBtn = document.getElementById("submitBtn");
    const toggle = document.getElementById("toggleMode");
    const errorEl = document.getElementById("authError");
    const okEl = document.getElementById("authOk");
    const configHint = document.getElementById("configHint");
    const email = document.getElementById("email");
    const password = document.getElementById("password");

    let mode = "signin";

    function showError(message) {
      errorEl.hidden = !message;
      errorEl.textContent = message || "";
      okEl.hidden = true;
    }

    function showOk(message) {
      okEl.hidden = !message;
      okEl.textContent = message || "";
      errorEl.hidden = true;
    }

    if (!isSupabaseConfigured()) {
      configHint.hidden = false;
      form.querySelectorAll("input, button").forEach((el) => { el.disabled = true; });
    } else {
      const session = await getSession();
      if (session?.user) window.location.href = "index.html";
    }

    toggle.addEventListener("click", () => {
      mode = mode === "signin" ? "signup" : "signin";
      title.textContent = mode === "signin" ? "Se connecter" : "Créer un compte";
      submitBtn.textContent = mode === "signin" ? "Connexion" : "Créer le compte";
      toggle.textContent = mode === "signin" ? "Créer le compte super-admin" : "J'ai déjà un compte";
      password.autocomplete = mode === "signin" ? "current-password" : "new-password";
      showError("");
      showOk("");
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      showOk("");
      submitBtn.disabled = true;
      try {
        if (mode === "signin") {
          await signIn(email.value.trim(), password.value);
          window.location.href = "index.html";
          return;
        }
        const result = await signUp(email.value.trim(), password.value);
        if (result.session) {
          showOk("Compte créé. Dans le SQL Editor Supabase, exécutez : select private.grant_super_admin('votre@email'); puis reconnectez-vous.");
        } else {
          showOk("Compte créé. Confirmez l'email si demandé, puis connectez-vous. Ensuite : select private.grant_super_admin('votre@email');");
        }
        mode = "signin";
        title.textContent = "Se connecter";
        submitBtn.textContent = "Connexion";
        toggle.textContent = "Créer le compte super-admin";
      } catch (err) {
        showError(authErrorMessage(err));
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
